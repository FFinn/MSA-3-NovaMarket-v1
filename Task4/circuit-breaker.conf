http {
    upstream logistics_backend {
        # Это не полноценный Circuit Breaker уровня сервисной сетки,
        # но для NGINX OSS это рабочая схема: пять ошибок за 30 секунд
        # временно исключают основной сервер. Резервный адрес нужен,
        # потому что одиночный server NGINX не помечает недоступным.
        server logistics.company.com:80 max_fails=5 fail_timeout=30s;
        server 127.0.0.1:65535 backup;
    }

    server {
        listen 8080;

        location /logistics/ {
            proxy_pass http://logistics_backend;
            proxy_connect_timeout 3s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            proxy_intercept_errors on;

            # Эти ошибки учитываются в max_fails.
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # При ошибке или тайм-ауте отдаём понятный запасной ответ.
            error_page 502 503 504 = @logistics_fallback;
        }

        location @logistics_fallback {
            default_type application/json;
            add_header Retry-After 30 always;
            return 503 '{"status":"temporarily_unavailable","service":"logistics","message":"Служба доставки временно недоступна. Попробуйте позже."}';
        }
    }
}
