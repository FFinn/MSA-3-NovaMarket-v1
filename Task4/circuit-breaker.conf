http {
    upstream logistics_backend {
        # Пять неуспешных попыток (ошибка связи, тайм-аут или 5xx,
        # заданные в proxy_next_upstream) за 30 секунд временно исключают
        # основной сервер на 30 секунд.
        # backup необходим: для группы из одного server max_fails игнорируется.
        server logistics.company.com:80 max_fails=5 fail_timeout=30s;
        server 127.0.0.1:65535 backup;
    }

    server {
        listen 8080;

        location /logistics/ {
            proxy_pass http://logistics_backend;
            proxy_connect_timeout 3s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            proxy_intercept_errors on;

            # Все перечисленные виды сбоев учитываются как неуспешная
            # попытка, а клиент вместо сырой ошибки получает fallback.
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            # Одна попытка на клиентский запрос: пять подряд неудач
            # переводят основной upstream в состояние недоступности.
            proxy_next_upstream_tries 1;
            error_page 500 502 503 504 = @logistics_fallback;
        }

        location @logistics_fallback {
            default_type application/json;
            add_header Retry-After 30 always;
            return 503 '{"status":"temporarily_unavailable","service":"logistics","message":"Служба доставки временно недоступна. Попробуйте позже."}';
        }
    }
}
