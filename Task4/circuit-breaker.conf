http {
    upstream logistics_backend {
        # В NGINX OSS max_fails/fail_timeout дают базовую реализацию
        # Circuit Breaker: пять неуспешных попыток за 30 секунд исключают
        # основной upstream на 30 секунд. Backup нужен, потому что для
        # единственного server в группе NGINX не помечает его недоступным.
        server logistics.company.com:80 max_fails=5 fail_timeout=30s;
        server 127.0.0.1:65535 backup;
    }

    server {
        listen 8080;

        location /logistics/ {
            proxy_pass http://logistics_backend;
            proxy_connect_timeout 3s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            proxy_intercept_errors on;

            # Ошибки и тайм-ауты учитываются при определении состояния upstream.
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # При timeout, ошибке upstream или временном исключении сервера
            # клиент получает контролируемый fallback вместо ожидания.
            error_page 502 503 504 = @logistics_fallback;
        }

        location @logistics_fallback {
            default_type application/json;
            add_header Retry-After 30 always;
            return 503 '{"status":"temporarily_unavailable","service":"logistics","message":"Служба доставки временно недоступна. Попробуйте позже."}';
        }
    }
}
