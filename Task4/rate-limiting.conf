http {
    # X-Client-Channel задаётся доверенным компонентом аутентификации,
    # расположенным перед этим NGINX. Он удаляет одноимённый входящий
    # заголовок клиента и заново устанавливает его по API-ключу/JWT.
    #
    # Пустой ключ не учитывается в limit_req_zone. Поэтому на общем /api/
    # активна только зона соответствующего канала.
    map $http_x_client_channel $web_limit_key {
        default "";
        web     $binary_remote_addr;
    }

    map $http_x_client_channel $mobile_limit_key {
        default "";
        mobile  $binary_remote_addr;
    }

    # Неопознанный канал получает более строгий мобильный лимит, а не обход
    # ограничений. После подключения нового доверенного канала его нужно
    # добавить отдельной зоной и правилом map.
    map $http_x_client_channel $unknown_limit_key {
        web     "";
        mobile  "";
        default $binary_remote_addr;
    }

    limit_req_zone $web_limit_key     zone=web_per_ip:10m     rate=50r/s;
    limit_req_zone $mobile_limit_key  zone=mobile_per_ip:10m  rate=30r/s;
    limit_req_zone $unknown_limit_key zone=unknown_per_ip:10m rate=30r/s;

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        limit_req_status 429;
        # Существующий общий маршрут не меняется.
        location /api/ {
            # burst не задан намеренно: лимиты являются строгими.
            limit_req zone=web_per_ip;
            limit_req zone=mobile_per_ip;
            limit_req zone=unknown_per_ip;
            proxy_pass http://backend;
        }

    }
}
