http {
    # Состояние хранится раздельно, ключ — клиентский IP.
    # Маршрут является явным признаком канала: его нельзя надёжно определить
    # по User-Agent, который клиент может подменить.
    limit_req_zone $binary_remote_addr zone=web_per_ip:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=mobile_per_ip:10m rate=30r/s;

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        limit_req_status 429;
        add_header Retry-After 1 always;

        # Веб-клиент вызывает /api/web/...
        location /api/web/ {
            limit_req zone=web_per_ip burst=50 nodelay;
            proxy_pass http://backend/;
        }

        # Мобильный клиент вызывает /api/mobile/...
        location /api/mobile/ {
            limit_req zone=mobile_per_ip burst=30 nodelay;
            proxy_pass http://backend/;
        }
    }
}
